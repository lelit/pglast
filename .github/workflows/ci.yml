name: Build, test and upload to PyPI

# Build on every branch push, tag push, and pull request change:
on: [push, pull_request]

# Global environment, common to all tasks
env:
  # Tell Python to not prepend the working directory to its sys.path: this is to avoid it
  # importing the "pglast" package from the source directory, that's not going to work because
  # the "pip install ." below stores the compiled parser.pyx module only in the destination
  # directory, and thus importing pglast from source directory does not work, and produce the
  # following error on GHA:
  #
  #   from pglast import ast, enums, parse_sql
  #   ImportError: cannot import name 'parse_sql' from 'pglast'
  #                (/home/runner/work/pglast/pglast/pglast/__init__.py).
  #                Did you mean: 'parse_plpgsql'?
  PYTHONSAFEPATH: true

jobs:
  doctest:
    name: All tests, on latest Python
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the libpg_query library
        run: |
          make -C libpg_query build

      - name: Install the module itself
        run: |
          python -m pip install .[test]

      - name: Execute the test suite
        run: |
          python -m pytest --cov-report=xml tests/
          make -C docs doctest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7

  build_wheels:
    name: Build wheels on ${{ matrix.arch }} for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel]
        arch: [auto]
        include:
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-2022
            arch: x86
          - os: windows-2022
            arch: AMD64

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up MSVC CLI tools
        if: ${{ matrix.os == 'windows-2022' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_TEST_REQUIRES: "coverage pytest pytest-cov"
          CIBW_TEST_COMMAND: "py.test {project}/tests"
          CIBW_BUILD: "cp*"
          CIBW_SKIP: "cp39*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENABLE: cpython-prerelease
          # Skip tests on emulated hardware, take too long or not supported
          CIBW_TEST_SKIP: "*-*linux_{aarch64,ppc64le}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-for-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    name: Upload wheels to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest

    # upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-for-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
